services:
  database:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: yiid-mom-db
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD:-StrongPassword123!}"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-StrongPassword123!}"
    volumes:
      - sqlsrv_data:/var/opt/mssql

volumes:
  sqlsrv_data:
