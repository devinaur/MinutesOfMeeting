; ==============================================================================
; Laravel YIID MoM Assistant - Supervisor Queue Worker Configuration
; ==============================================================================
; Lokasi deployment di server Ubuntu/Debian Linux:
;   /etc/supervisor/conf.d/yiid-mom-worker.conf
;
; Cara aktivasi di server:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start yiid-mom-worker:*
; ==============================================================================

[program:yiid-mom-worker]
process_name=%(program_name)s_%(process_num)02d

command=php /var/www/yiid-mom/artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600 --max-jobs=1000

autostart=true
autorestart=true

stopasgroup=true
killasgroup=true
stopwaitsecs=3600

user=www-data
numprocs=2

redirect_stderr=true
stdout_logfile=/var/log/supervisor/yiid-mom-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

